name: Profile cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=LipeVaz&locale=pt-br&show_icons=true&include_all_commits=true&rank_icon=github&hide_border=true&bg_color=010736&title_color=FCF1D0&text_color=C9D3EE&icon_color=FCF1D0&ring_color=FCF1D0'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=LipeVaz&locale=pt-br&layout=compact&langs_count=8&hide_border=true&bg_color=010736&title_color=FCF1D0&text_color=C9D3EE'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trophies
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: LipeVaz
          output_path: profile/trophy.svg
          theme: darkhub
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "chore: atualiza cards do perfil" || exit 0
          git push
