<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Fellipe Vaz</title>
  <desc id="d">Desenvolvedor Full Stack, do backend ao app mobile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010736"/>
      <stop offset="1" stop-color="#0D1C42"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.15" r="0.65">
      <stop offset="0" stop-color="#22396F" stop-opacity=".6"/>
      <stop offset="1" stop-color="#22396F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FCF1D0" opacity=".035"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="16"/></clipPath>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .sans{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif}
    .bar{transform-box:fill-box;transform-origin:left center;animation:wipe .7s cubic-bezier(.2,.8,.2,1) both}
    .acc{transform-box:fill-box;transform-origin:center bottom;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
    .txt{animation:in .5s ease-out both}
    .b1{animation-delay:.3s}.b2{animation-delay:.6s}
    .t1{animation-delay:.8s}.t2{animation-delay:1.05s}.t0{animation-delay:.1s}
    .dot{animation:blink 1.6s steps(1) 1.5s infinite}
    @keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    @keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
    @keyframes blink{50%{opacity:.15}}
    @media (prefers-reduced-motion:reduce){.bar,.acc,.txt,.dot{animation:none}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
    <rect width="1200" height="360" fill="url(#scan)"/>

    <g stroke="#22396F" stroke-width="2" fill="none">
      <path d="M40 64V40h24"/>
      <path d="M1136 40h24v24"/>
      <path d="M1160 296v24h-24"/>
      <path d="M64 320H40v-24"/>
    </g>

    <text class="mono txt t0" x="100" y="100" font-size="14" letter-spacing="4" fill="#7A8BB5">GITHUB.COM/LIPEVAZ</text>

    <circle class="dot" cx="1046" cy="95" r="5" fill="#FCF1D0"/>
    <text class="mono" x="1120" y="100" font-size="14" letter-spacing="4" fill="#FCF1D0" text-anchor="end">NO AR</text>

    <rect class="acc" x="80" y="172" width="12" height="128" fill="#FCF1D0"/>
    <rect class="bar b1" x="100" y="172" width="620" height="84" fill="#FCF1D0"/>
    <rect class="bar b2" x="100" y="256" width="680" height="44" fill="#22396F"/>

    <text class="sans txt t1" x="128" y="236" font-size="62" font-weight="800" letter-spacing="2" fill="#010736">FELLIPE VAZ</text>
    <text class="sans txt t2" x="128" y="285" font-size="20" font-weight="500" letter-spacing=".5" fill="#FCF1D0">Desenvolvedor Full Stack — do backend ao app mobile</text>
  </g>
</svg>